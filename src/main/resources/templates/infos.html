<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    <script>
        window.onload = () => {
            fetch('/projeto/getAll')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Erro ao buscar dados.");
                    }
                    return response.json();
                })
                .then(data => {
                    const jsonFormatted = JSON.stringify(data, null, 2);
                    document.getElementById('jsonDisplay').textContent = jsonFormatted;
                })
                .catch(error => {
                    document.getElementById('jsonDisplay').textContent = "Erro: " + error;
                });
        };
    </script>
</head>
<body>
    <h1>Lista de Usuários (Formato JSON)</h1>
    <pre id="jsonDisplay">Carregando...</pre>
</body>
</html>
